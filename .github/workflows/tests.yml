name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PROJECT_ENVIRONMENT: venv
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.1'
          python-version: '3.12'
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libnss3 libasound2t64
      - run: uv sync --frozen --all-packages --all-groups
      - run: venv/bin/ruff check src tests desktop/src desktop/tests
      - run: venv/bin/mypy
      - run: venv/bin/python tools/check_docs.py docs/
      - run: venv/bin/python -m pytest tests/unit -q --junitxml=work/unit.xml
      - run: venv/bin/python -m pytest desktop/tests/unit desktop/tests/contract -q --junitxml=work/desktop.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-results
          path: work/*.xml
  graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [tests/integration, tests/acceptance, desktop/tests/integration]
    env:
      UV_PROJECT_ENVIRONMENT: venv
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.1'
          python-version: '3.12'
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libnss3 libasound2t64
      - run: uv sync --frozen --all-packages --all-groups
      - run: venv/bin/python -m pytest ${{ matrix.suite }} -q --junitxml=work/graph.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-results-${{ strategy.job-index }}
          path: work/graph.xml
