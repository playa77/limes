name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PROJECT_ENVIRONMENT: venv
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.1'
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libnss3 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libgbm1
      - run: uv sync --frozen --all-packages --python 3.12
      - run: venv/bin/ruff check src tests desktop/src desktop/tests
      - run: venv/bin/ruff check tools/build_context.py tools/deploy.py tools/init_config.py tools/generate_runtime_docs.py tools/smoke_test.py tools/qualify.py docker/neo4j_control.py
      - run: venv/bin/mypy
      - run: venv/bin/python tools/check_docs.py docs/
      - run: venv/bin/python -m pytest tests/unit -q --junitxml=test-results/unit.xml
      - run: venv/bin/python -m pytest desktop/tests/unit desktop/tests/contract -q --junitxml=test-results/desktop.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-results
          path: test-results/
  graph:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_PROJECT_ENVIRONMENT: venv
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.1'
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libnss3 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libgbm1
      - run: uv sync --frozen --all-packages --python 3.12
      # Separate sessions avoid pytest's nested acceptance plugin collection issue.
      - run: venv/bin/python -m pytest tests/integration --ignore=tests/integration/test_runtime_stack.py -q --junitxml=test-results/integration.xml
      - run: venv/bin/python -m pytest tests/acceptance -q --junitxml=test-results/acceptance.xml
      - run: venv/bin/python -m pytest desktop/tests/integration -q --junitxml=test-results/desktop-integration.xml
      # Isolate image builds/three services from the shared graph fixture.
      - run: venv/bin/python -m pytest tests/integration/test_runtime_stack.py -q --junitxml=test-results/runtime-stack.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-results
          path: test-results/
  smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_PROJECT_ENVIRONMENT: venv
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.1'
          enable-cache: true
      - run: uv sync --frozen --all-packages --python 3.12
      - run: venv/bin/python tools/check_docs.py docs/
      - run: venv/bin/python -m pytest tests/unit/test_config.py tests/unit/test_news.py tests/unit/test_runtime_docs.py -q
  candidate-check:
    if: always()
    needs: [offline, graph, smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the complete applicable lanes
        env:
          EVENT: ${{ github.event_name }}
          OFFLINE: ${{ needs.offline.result }}
          GRAPH: ${{ needs.graph.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          python3 - <<'PY'
          import os
          required = ['SMOKE'] if os.environ['EVENT'] == 'push' else ['OFFLINE', 'GRAPH']
          failed = [name for name in required if os.environ[name] != 'success']
          if failed:
              raise SystemExit('Required lanes did not succeed: ' + ', '.join(failed))
          PY
