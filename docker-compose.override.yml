# LIMES Compose development override | v1.1.0 | source mounts and reload
# Publication and authentication are identical to the base topology.
services:
  api:
    command:
      - uvicorn
      - limes.api.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    volumes:
      - ./src:/app/src
      - ./ontology:/app/ontology
    environment:
      - LIMES_LOG_LEVEL=DEBUG
      - LIMES_LOG_FORMAT=console

  worker:
    volumes:
      - ./src:/app/src
      - ./ontology:/app/ontology
      - ./reference_questions:/app/reference_questions
    environment:
      - LIMES_LOG_LEVEL=DEBUG
      - LIMES_LOG_FORMAT=console

  neo4j:
    environment:
      - NEO4J_DEBUG=true
