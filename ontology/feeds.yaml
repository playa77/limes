# Feed configuration for the FeedsAdapter (WP-21) — the curated RSS/Atom set.
# Consumed by src/limes/sources/feeds.py; the path is LIMES_FEEDS_CONFIG_PATH.
#
# Each entry: url (RSS/Atom), name (curator label), language (de|en — the
# feed's declared language, used as the document language), trust_rank
# (per-feed override of the adapter's 0.60 default; Doc 1 §5.8 ranks
# government releases at 0.70 and curated news outlets at 0.60). Feeds
# without a trust_rank default to 0.60.
#
# 2.0.0 (BE-59): Nordrhein-Westfalen scope. EU Commission RAPID, Bundesregierung
# and tagesschau are replaced by the NRW state government portal and WDR's NRW
# politics feed; both URLs answered with RSS/Atom on 2026-11-17.
#
# The URLs are the single refresh point: a feed that moves is updated here
# and nowhere else.
version: "2.0.0"
feeds:
  - url: https://www.land.nrw/rss.xml
    name: Landesregierung Nordrhein-Westfalen (land.nrw)
    language: de
    trust_rank: 0.70
  - url: https://www1.wdr.de/politik/politik-in-nrw/uebersicht-landespolitik-100.feed
    name: WDR Politik in NRW
    language: de
    trust_rank: 0.60
