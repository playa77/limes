# Unprivileged services. Only the authenticated API is published, on loopback.
name: limes
services:
  neo4j:
    image: limes-neo4j:${LIMES_REVISION:-dev}
    build:
      context: .
      args:
        LIMES_REVISION: ${LIMES_REVISION:-dev}
      dockerfile: docker/neo4j.Dockerfile
    user: "7474:7474"
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      LIMES_NEO4J_USER: ${LIMES_NEO4J_USER:-limes}
      LIMES_NEO4J_PASSWORD: ${LIMES_NEO4J_PASSWORD:?set LIMES_NEO4J_PASSWORD}
      LIMES_BACKUP_TOKEN: ${LIMES_BACKUP_TOKEN:?set LIMES_BACKUP_TOKEN}
      NEO4J_AUTH: neo4j/${LIMES_NEO4J_PASSWORD:?set LIMES_NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_server_memory_heap_initial__size:-2G}
      NEO4J_server_memory_heap_max__size: ${NEO4J_server_memory_heap_max__size:-2G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_server_memory_pagecache_size:-2G}
      NEO4J_db_memory_transaction_total_max: ${NEO4J_db_memory_transaction_total_max:-512m}
      NEO4J_db_transaction_timeout: ${NEO4J_db_transaction_timeout:-120s}
    healthcheck:
      test: [CMD-SHELL, 'NEO4J_PASSWORD="$$LIMES_NEO4J_PASSWORD" cypher-shell -u "$$LIMES_NEO4J_USER" --non-interactive "RETURN 1" >/dev/null 2>&1']
      interval: 15s
      timeout: 15s
      retries: 24
      start_period: 90s
    stop_grace_period: 180s
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - archive:/data/archive
    networks: [limes]
  api:
    image: limes-api:${LIMES_REVISION:-dev}
    build:
      context: .
      args:
        LIMES_REVISION: ${LIMES_REVISION:-dev}
      dockerfile: docker/api.Dockerfile
    user: "7474:7474"
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; from limes.config import load_settings; s=load_settings(); r=urllib.request.Request("http://127.0.0.1:8000/health", headers={"Authorization": "Bearer "+s.api_token.get_secret_value()}); urllib.request.urlopen(r, timeout=10)']
      interval: 15s
      timeout: 15s
      retries: 3
      start_period: 60s
    volumes:
      - ./config:/app/config:ro
      - jobs:/data/jobs
      - models:/data/models:ro
    depends_on:
      neo4j:
        condition: service_healthy
    networks: [limes]
  worker:
    image: limes-worker:${LIMES_REVISION:-dev}
    build:
      context: .
      args:
        LIMES_REVISION: ${LIMES_REVISION:-dev}
      dockerfile: docker/worker.Dockerfile
    user: "7474:7474"
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      LIMES_MODELS_FILE: /data/models/models.env
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1},neo4j,api"
    healthcheck:
      test: [CMD, python, -c, 'import time; from pathlib import Path; p=Path("/data/jobs/jobs.heartbeat"); assert time.time()-p.stat().st_mtime < 30']
      interval: 15s
      timeout: 5s
      retries: 3
    stop_grace_period: 240s
    volumes:
      - ./config:/app/config:ro
      - gold_set:/app/gold_set
      - archive:/data/archive
      - jobs:/data/jobs
      - models:/data/models
    depends_on:
      neo4j:
        condition: service_healthy
    networks: [limes]
volumes:
  neo4j_data:
  neo4j_logs:
  archive:
  jobs:
  gold_set:
  models:
networks:
  limes:
