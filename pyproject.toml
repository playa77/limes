[project]
name = "limes"
version = "0.1.0"
description = "Ontology-driven knowledge graph for German and European policy and geostrategic analysis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "neo4j>=5.24",
    "httpx>=0.27",
    "tenacity>=9.0",
    "dash>=2.18",
    "dash-cytoscape>=1.0",
    "dash-leaflet>=1.0",
    "plotly>=5.24",
    "spacy>=3.7,<4",
    "de-core-news-md @ https://github.com/explosion/spacy-models/releases/download/de_core_news_md-3.8.0/de_core_news_md-3.8.0-py3-none-any.whl",
    "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
    "lxml>=5.3",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "orjson>=3.10",
    "structlog>=24.4",
    "python-dateutil>=2.9",
    "pandas>=2.2",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "coverage>=7.15",
]

# Hatchling build backend: the prompt templates under
# src/limes/extraction/prompts/*.md are runtime package data
# (extraction/base.py prompt_path); uv_build packages only Python sources,
# which broke extraction/adjudication/nl2cypher inside the Docker images.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/limes"]

# The `limes` console script (Doc 2 §8.14): registered by WP-38 per the
# assignment in cli/main.py, so the worker container's PATH carries it.
[project.scripts]
limes = "limes.cli.main:main"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["ontology/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Cypher DDL statements are single strings; they cannot be split without
# breaking the statement. Line length is waived for this module only.
"src/limes/graph/schema.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/limes", "desktop/src/limes_desktop"]

# uv 0.12.5 supports workspaces; the desktop client is a workspace member so
# that `limes-desktop` and PySide6 install into the root venv via `uv sync`.
# PySide6 ships wheels only for mainstream CPython platforms; without this
# guard the universal resolver rejects the workspace outright.
[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.workspace]
members = ["desktop"]

[tool.uv.sources]
limes-desktop = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
