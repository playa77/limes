[project]
name = "limes"
version = "0.1.0"
description = "Ontology-driven knowledge graph for German and European policy and geostrategic analysis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "neo4j>=5.24",
    "httpx>=0.27",
    "tenacity>=9.0",
    "dash>=2.18",
    "dash-cytoscape>=1.0",
    "dash-leaflet>=1.0",
    "plotly>=5.24",
    "spacy>=3.7,<4",
    "de-core-news-md @ https://github.com/explosion/spacy-models/releases/download/de_core_news_md-3.8.0/de_core_news_md-3.8.0-py3-none-any.whl",
    "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
    "lxml>=5.3",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "orjson>=3.10",
    "structlog>=24.4",
    "python-dateutil>=2.9",
    "pandas>=2.2",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["ontology/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/limes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
