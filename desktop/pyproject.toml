# desktop/pyproject.toml | v1.1.0 | DC-17: launcher workspace member (FastAPI + ReUI SPA host)
[project]
name = "limes-desktop"
version = "1.1.0"
description = "Local launcher for the LIMES web desktop — static SPA, bearer proxy, profile store"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

# Hatchling backend, consistent with the root package. The built ReUI SPA is
# not shipped inside the wheel: the launcher resolves `desktop/web/dist` (or
# `$LIMES_DESKTOP_DIST`) at run time — packaged bundle deployment stays
# deferred in the roadmap.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/limes_desktop"]

[project.scripts]
limes-desktop = "limes_desktop.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../src"]
