# desktop/pyproject.toml | v0.1.0 | Desktop client workspace member: packaging, deps, tooling config
[project]
name = "limes-desktop"
version = "0.1.0"
description = "PySide6 desktop client for the LIMES knowledge graph"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyside6>=6.7",
    # NOTE: the brief says `pyside6-webengine>=6.7`, but no such PyPI project
    # exists (registry 404). QtWebEngine ships inside PySide6_Addons.
    "pyside6-addons>=6.7",
    "httpx>=0.27",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

# Hatchling backend, same rationale as the root package: future packaged
# resources (QML/assets) need a backend that ships non-Python files.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/limes_desktop"]

[project.scripts]
limes-desktop = "limes_desktop.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../src"]
