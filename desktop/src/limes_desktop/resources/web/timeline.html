<!DOCTYPE html>
<!-- desktop/src/limes_desktop/resources/web/timeline.html | v0.1.0 | Plotly bitemporal timeline page (FR-DC-042) -->
<html>
<head>
  <meta charset="utf-8">
  <script src="vendor/plotly.min.js"></script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <style>
    html, body { margin: 0; height: 100%; }
    #tl { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="tl"></div>
  <script>
    let bridge = null;
    const layout = {
      xaxis: { title: 'time' },
      yaxis: { tickvals: [], title: 'assertions' },
      legend: { orientation: 'h' },
      margin: { l: 40, r: 20, t: 20, b: 40 },
    };

    new QWebChannel(qt.webChannelTransport, (channel) => {
      bridge = channel.objects.bridge;
    });

    // range selection (e.g. plotly_select event) publishes the shared filter

    function trace(events, name, color) {
      const seen = [];
      const ys = [];
      (events || []).forEach((e) => {
        seen.push(e.t);
        ys.push(seen.length);
      });
      return {
        x: (events || []).map((e) => e.t),
        y: ys,
        text: (events || []).map((e) => e.relation),
        mode: 'markers',
        name: name,
        customdata: (events || []).map((e) => e.source),
        marker: { color: color },
      };
    }

    let attached = false;
    function render(payload) {
      const traces = [
        trace(payload.validity, 'validity time', '#2e7d32'),
        trace(payload.belief, 'belief time (recorded_at)', '#f9a825'),
      ];
      traces.forEach((t) => {
        t.marker.size = t.customdata.map(id => id === payload.selected_id ? 14 : 7);
      });
      Plotly.react('tl', traces, layout).then(() => {
        if (attached) return;
        attached = true;
        const gd = document.getElementById('tl');
        gd.on('plotly_click', evt => {
          if (bridge && evt.points.length && evt.points[0].customdata) bridge.on_node_clicked(evt.points[0].customdata);
        });
        gd.on('plotly_relayout', evt => {
          const range = evt['xaxis.range'] ||
            [evt['xaxis.range[0]'], evt['xaxis.range[1]']];
          if (bridge && range[0] && range[1])
            bridge.on_temporal_range(range[0], range[1]);
        });
      });
    }
    window.pushResult = render;
  </script>
</body>
</html>
