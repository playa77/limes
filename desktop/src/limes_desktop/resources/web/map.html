<!DOCTYPE html>
<!-- desktop/src/limes_desktop/resources/web/map.html | v0.1.0 | Leaflet map page (FR-DC-041) -->
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <script src="vendor/leaflet.js"></script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <style>
    html, body { margin: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    let bridge = null;
    const map = L.map('map').setView([51.0, 10.0], 5);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
    }).addTo(map);
    const markerLayer = L.layerGroup().addTo(map);
    const lineLayer = L.layerGroup().addTo(map);

    new QWebChannel(qt.webChannelTransport, (channel) => {
      bridge = channel.objects.bridge;
      bridge.selection_changed.connect((id) => render(lastPayload, id));
    });

    let lastPayload = null;

    function render(payload, selectedId) {
      if (!payload) return;
      lastPayload = payload;
      markerLayer.clearLayers();
      lineLayer.clearLayers();
      const byId = {};
      (payload.nodes || []).forEach((n) => {
        byId[n.id] = n;
        if (n.geometry) {
          L.marker(n.geometry)
            .bindTooltip(n.label)
            .addTo(markerLayer);
        }
      });
      (payload.lines || []).forEach((line) => {
        if (line.selected || line.source === selectedId || line.target === selectedId) {
          L.polyline(line.points, { color: '#c62828', weight: 3 })
            .bindTooltip(line.relation)
            .addTo(lineLayer);
        }
      });
    }

    window.pushResult = render;
  </script>
</body>
</html>
